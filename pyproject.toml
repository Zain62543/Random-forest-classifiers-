[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-classification"
version = "0.2.0"
description = "Reproducible tabular classification benchmark: Random Forest vs Logistic Regression vs Decision Tree, with CV, tuning and reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zain Ud Din" }]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn>=1.3",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ml-classify = "ml_classification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
